{% extends 'base.html' %}
{% load static %}
{% block content %}
  <h2>Registra un nuovo evento botanico</h2>

  {% if messages %}
    <ul class="messages">
      {% for message in messages %}
        <li>{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Salva evento</button>
  </form>
{% endblock %}
